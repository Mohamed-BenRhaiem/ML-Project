name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint (black + flake8 + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint tools
        run: pip install black flake8 isort
      - name: black --check
        run: black --check --line-length 100 . || true
      - name: isort --check-only
        run: isort --check-only --profile black . || true
      - name: flake8
        run: flake8 --max-line-length 110 --extend-ignore=E203,W503,E501 . || true

  tests:
    name: Pytest (schema + NLP + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Train pipeline (génère artifacts/)
        env:
          PYTHONIOENCODING: utf-8
          DISABLE_MLFLOW: "1"  # pas besoin de MLflow en CI
        run: python nettoyage.py
      - name: Run pytest with coverage
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train pipeline (artefacts requis pour le Dockerfile)
        env:
          PYTHONIOENCODING: utf-8
          DISABLE_MLFLOW: "1"
        run: python nettoyage.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: eco-smart-classifier:ci-${{ github.sha }}
          load: true
      - name: Smoke test container
        run: |
          docker run -d --name eco-smart-test -p 8000:8000 eco-smart-classifier:ci-${{ github.sha }}
          sleep 8
          curl -fsS http://localhost:8000/metadata | head -c 500
          docker logs eco-smart-test
          docker stop eco-smart-test
