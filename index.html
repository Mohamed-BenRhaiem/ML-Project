<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eco-Smart Classifier</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #f7f7f4;
    --surface: #ffffff;
    --border: #e2e2dc;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2f7a2f;
    --accent-hover: #246124;
    --error-bg: #fff5f5;
    --error-border: #f0c2c2;
    --error-text: #b91c1c;
    --font-sans: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-weight: 300;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container { max-width: 720px; margin: 0 auto; }

  .header { margin-bottom: 2.5rem; }
  .header-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }
  h1 {
    font-size: 26px;
    font-weight: 400;
    line-height: 1.2;
    color: var(--text);
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 1rem;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #c2c2bc;
    flex-shrink: 0;
  }
  .dot.ok { background: var(--accent); }
  .dot.loading { background: #d97706; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 1.5rem;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .field input, .field select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 9px 12px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: var(--surface); color: var(--text); }

  .rapport-field { margin-bottom: 1.5rem; }
  .rapport-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 300;
    line-height: 1.6;
    resize: vertical;
    min-height: 90px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }

  .predict-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  .predict-btn:hover { background: var(--accent-hover); }
  .predict-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .error {
    margin-top: 10px;
    padding: 10px 14px;
    border: 1px solid var(--error-border);
    border-radius: 4px;
    background: var(--error-bg);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--error-text);
    display: none;
  }

  .result {
    margin-top: 2rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    display: none;
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .result-header {
    background: #f0f0eb;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .result-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .result-price {
    font-family: var(--font-mono);
    font-size: 30px;
    font-weight: 500;
    color: var(--accent);
  }
  .result-body { padding: 1.25rem; }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .result-row:last-child { border-bottom: none; }
  .result-row .key { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
  .result-row .val { color: var(--text); font-weight: 400; text-align: right; max-width: 60%; }

  .top-features {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }
  .top-features-title {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }
  .feat-bar { margin-bottom: 7px; }
  .feat-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 3px;
    color: var(--text);
    font-family: var(--font-mono);
  }
  .feat-bar-label .feat-val { color: var(--muted); }
  .bar-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  @media (max-width: 500px) {
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-tag">Eco-Smart Classifier</div>
    <h1>Classification du matériau<br>+ prix de revente estimé</h1>
    <div class="status-bar">
      <div class="dot loading" id="dot-api"></div>
      <span id="status-api">Connexion à l'API…</span>
    </div>
  </div>

  <!-- Formulaire (Categorie est PRÉDITE, plus saisie) -->
  <div class="form-grid">
    <div class="field">
      <label>Source</label>
      <select id="source"></select>
    </div>
    <div class="field">
      <label>Poids (kg)</label>
      <input type="number" id="poids" placeholder="2.5" min="0" step="0.1"/>
    </div>
    <div class="field">
      <label>Volume (L)</label>
      <input type="number" id="volume" placeholder="5.0" min="0" step="0.1"/>
    </div>
    <div class="field">
      <label>Conductivité</label>
      <input type="number" id="conductivite" placeholder="0.85" step="0.01"/>
    </div>
    <div class="field">
      <label>Opacité</label>
      <input type="number" id="opacite" placeholder="0.6" min="0" max="1" step="0.01"/>
    </div>
    <div class="field">
      <label>Rigidité</label>
      <input type="number" id="rigidite" placeholder="3.2" step="0.1"/>
    </div>
  </div>

  <div class="rapport-field">
    <label>Rapport de collecte (texte NLP)</label>
    <textarea id="rapport" placeholder="Ex: Objet plastique rigide, légèrement endommagé, provenant d'un ménage. Composé de polyéthylène haute densité..."></textarea>
  </div>

  <button class="predict-btn" id="btn-predict" onclick="predict()" disabled>
    CONNEXION À L'API…
  </button>
  <div class="error" id="err"></div>

  <!-- Résultat classification -->
  <div class="result" id="result-clf">
    <div class="result-header">
      <span class="result-label">Catégorie prédite</span>
      <span class="result-price" id="out-category">—</span>
    </div>
    <div class="result-body">
      <div class="top-features">
        <div class="top-features-title">Probabilités par classe</div>
        <div id="proba-bars"></div>
      </div>
    </div>
  </div>

  <!-- Résultat régression -->
  <div class="result" id="result-reg">
    <div class="result-header">
      <span class="result-label">Prix de revente estimé</span>
      <span class="result-price" id="out-price">—</span>
    </div>
    <div class="result-body">
      <div class="result-row">
        <span class="key">contribution numérique</span>
        <span class="val" id="out-num">—</span>
      </div>
      <div class="result-row">
        <span class="key">contribution texte (NLP)</span>
        <span class="val" id="out-nlp">—</span>
      </div>
      <div class="result-row">
        <span class="key">contribution source</span>
        <span class="val" id="out-cat">—</span>
      </div>
      <div class="top-features" id="top-features-block">
        <div class="top-features-title">Mots les plus influents (TF-IDF)</div>
        <div id="feat-bars"></div>
      </div>
    </div>
  </div>

</div>
<script>
// API : même origine si servie par FastAPI, sinon 127.0.0.1:8000
const API_BASE = (location.protocol === 'file:' || !location.host)
  ? 'http://127.0.0.1:8000'
  : '';

const LABELS = {
  Source: {
    Centre_Tri: 'Centre de tri',
    Collecte_Citoyenne: 'Collecte citoyenne',
    Usine_A: 'Usine A',
    Usine_B: 'Usine B'
  }
};

let META = null;

// ── Init : récupère metadata et peuple les <select> ──────────────
async function init() {
  try {
    const r = await fetch(API_BASE + '/metadata');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    META = await r.json();

    fillSelect('source', META.categories.Source || [], 'Source');

    document.getElementById('dot-api').className = 'dot ok';
    document.getElementById('status-api').textContent =
      'API connectée · classif=' + META.clf_model + ' · régression=' + META.reg_model;

    const btn = document.getElementById('btn-predict');
    btn.disabled = false;
    btn.textContent = 'CLASSIFIER + ESTIMER LE PRIX';
  } catch (e) {
    document.getElementById('dot-api').className = 'dot';
    document.getElementById('status-api').textContent =
      'API hors ligne — lance : uvicorn main:app --reload';
    showErr('Impossible de joindre l\'API : ' + e.message);
  }
}

function fillSelect(id, values, col) {
  const sel = document.getElementById(id);
  sel.innerHTML = values
    .map(v => {
      const label = (LABELS[col] && LABELS[col][v]) || v;
      return `<option value="${v}">${label}</option>`;
    })
    .join('');
}

// ── Prédiction via API ───────────────────────────────────────────
async function predict() {
  document.getElementById('err').style.display = 'none';

  const rapport = document.getElementById('rapport').value.trim();
  const poids   = parseFloat(document.getElementById('poids').value);
  const volume  = parseFloat(document.getElementById('volume').value);

  if (!rapport || isNaN(poids) || isNaN(volume)) {
    showErr('Remplis au moins Poids, Volume et le Rapport de collecte.');
    return;
  }

  const payload = {
    Source:           document.getElementById('source').value,
    Poids:            poids,
    Volume:           volume,
    Conductivite:     parseFloat(document.getElementById('conductivite').value) || 0,
    Opacite:          parseFloat(document.getElementById('opacite').value) || 0,
    Rigidite:         parseFloat(document.getElementById('rigidite').value) || 0,
    Rapport_Collecte: rapport
  };

  const btn = document.getElementById('btn-predict');
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'PRÉDICTION EN COURS…';

  try {
    const r = await fetch(API_BASE + '/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: 'Erreur ' + r.status }));
      throw new Error(err.detail || 'Erreur ' + r.status);
    }
    const data = await r.json();
    renderResult(data);
  } catch (e) {
    showErr('Prédiction échouée : ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

function renderResult(data) {
  // ─── Classification ───
  document.getElementById('out-category').textContent = data.predicted_category;

  const probas = data.class_probabilities || [];
  document.getElementById('proba-bars').innerHTML = probas.map(p => `
    <div class="feat-bar">
      <div class="feat-bar-label">
        <span>${p.label}</span>
        <span class="feat-val">${(p.proba * 100).toFixed(1)}%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(p.proba * 100).toFixed(1)}%"></div>
      </div>
    </div>
  `).join('');

  // ─── Régression ───
  document.getElementById('out-price').textContent = data.price.toFixed(2) + ' €';
  document.getElementById('out-num').textContent =
    (data.contrib_num >= 0 ? '+' : '') + data.contrib_num.toFixed(2) + ' €';
  document.getElementById('out-nlp').textContent =
    (data.contrib_nlp >= 0 ? '+' : '') + data.contrib_nlp.toFixed(2) + ' €';
  document.getElementById('out-cat').textContent =
    (data.contrib_cat >= 0 ? '+' : '') + data.contrib_cat.toFixed(2) + ' €';

  const words = data.top_words || [];
  const maxImpact = words[0]?.impact || 1;
  document.getElementById('feat-bars').innerHTML = words.map(d => `
    <div class="feat-bar">
      <div class="feat-bar-label">
        <span>${d.word}</span>
        <span class="feat-val">${d.impact.toFixed(4)}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(d.impact/maxImpact*100).toFixed(1)}%"></div>
      </div>
    </div>
  `).join('');

  document.getElementById('result-clf').style.display = 'block';
  document.getElementById('result-reg').style.display = 'block';
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}

init();
</script>
</body>
</html>
